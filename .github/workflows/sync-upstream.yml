name: Sync upstream

on:
  schedule:
    # 每天北京时间 11:23 检查更新
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'chnnic/jiwo-probe'
    runs-on: ubuntu-latest

    steps:
      - name: Check out user repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 50 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo

          cd repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 明确设置 origin 的认证地址，确保后续 push 使用 GITHUB_TOKEN
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Merge upstream updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo

          git remote add upstream "https://github.com/chnnic/jiwo-probe.git"
          git fetch --no-tags upstream main

          if git diff --quiet HEAD "upstream/main"; then
            echo "Already up to date."
            exit 0
          fi

          git merge --no-edit "upstream/main" || {
            echo "::error::与本地改动冲突, 请手动处理以下文件:"
            git diff --name-only --diff-filter=U
            exit 1
          }

          git push origin "HEAD:${GITHUB_REF_NAME}"
